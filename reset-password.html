<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/webp" href="images/zackconnect-logo.webp">
    <link rel="preconnect" href="https://zackconnectautobackend.onrender.com" crossorigin>
    <meta name="description" content="Choose a new password for your Zackconnect Autos account.">
    <title>Reset Password - Zackconnect Autos</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/api.js" defer></script>
    <script src="js/auth.js" defer></script>
</head>
<body class="auth-page login-page">
    <header class="auth-header">
        <a href="index.html" class="auth-brand"><img src="images/zackconnect-logo.webp" alt="">Zackconnect Autos</a>
        <a href="login.html" class="auth-header-link">Log in</a>
    </header>

    <main class="auth-main">
        <section class="auth-card" aria-labelledby="resetPasswordTitle">
            <a href="login.html" class="auth-back-link">&larr; Back to log in</a>
            <p class="auth-eyebrow">Account recovery</p>
            <h1 id="resetPasswordTitle">Choose a new password</h1>
            <p class="auth-intro">Use at least 8 characters for your new password.</p>

            <form id="resetPasswordForm" class="auth-screen-form" novalidate>
                <div class="form-group">
                    <label for="resetPassword">New password</label>
                    <input id="resetPassword" name="password" type="password" autocomplete="new-password" minlength="8" required>
                </div>
                <div class="form-group">
                    <label for="confirmResetPassword">Confirm new password</label>
                    <input id="confirmResetPassword" name="confirmPassword" type="password" autocomplete="new-password" required>
                </div>
                <p class="auth-message" id="resetPasswordMessage" role="alert" aria-live="polite"></p>
                <button type="submit" class="btn btn-primary btn-full">Reset password</button>
            </form>
        </section>
    </main>
</body>
</html>
