<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/webp" href="images/zackconnect-logo.webp">
    <link rel="preconnect" href="https://zackconnectautobackend.onrender.com" crossorigin>
    <meta name="description" content="Log in to your Zackconnect Autos account to continue browsing vehicles and import services.">
    <title>Log In - Zackconnect Autos</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/api.js" defer></script>
    <script src="js/auth.js" defer></script>
</head>
<body class="auth-page login-page">
    <header class="auth-header">
        <a href="index.html" class="auth-brand"><img src="images/zackconnect-logo.webp" alt="">Zackconnect Autos</a>
        <a href="signup.html" class="auth-header-link">Create account</a>
    </header>

    <main class="auth-main">
        <section class="auth-card" aria-labelledby="loginTitle">
            <a href="index.html" class="auth-back-link">&larr; Back to home</a>
            <p class="auth-eyebrow">Welcome back</p>
            <h1 id="loginTitle">Log in to Zackconnect Autos</h1>
            <p class="auth-intro">Log in to continue to the page you selected.</p>

            <form id="loginForm" class="auth-screen-form" novalidate>
                <div class="form-group">
                    <label for="loginEmail">Email address</label>
                    <input id="loginEmail" name="email" type="email" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input id="loginPassword" name="password" type="password" autocomplete="current-password" required>
                </div>
                <p class="auth-forgot-password"><a id="forgotPasswordLink" href="forgot-password.html">Forgot password?</a></p>
                <p class="auth-message" id="loginMessage" role="alert" aria-live="polite"></p>
                <button type="submit" class="btn btn-primary btn-full">Log in</button>
            </form>

            <p class="auth-switch">New to Zackconnect Autos? <a href="signup.html">Create an account</a></p>
        </section>
    </main>
</body>
</html>
