<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/webp" href="images/zackconnect-logo.webp">
    <link rel="preconnect" href="https://zackconnectautobackend.onrender.com" crossorigin>
    <meta name="description" content="Create your Zackconnect Autos account to continue browsing vehicles and import services.">
    <title>Create Account - Zackconnect Autos</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/api.js" defer></script>
    <script src="js/auth.js" defer></script>
</head>
<body class="auth-page signup-page">
    <video class="auth-background-video" autoplay muted loop playsinline preload="metadata" aria-hidden="true" tabindex="-1">
        <source src="assets/signup-background.mp4" type="video/mp4">
    </video>
    <header class="auth-header">
        <a href="index.html" class="auth-brand"><img src="images/zackconnect-logo.webp" alt="">Zackconnect Autos</a>
        <a href="login.html" class="auth-header-link">Log in</a>
    </header>

    <main class="auth-main">
        <section class="auth-card" aria-labelledby="signupTitle">
            <a href="index.html" class="auth-back-link">&larr; Back to home</a>
            <p class="auth-eyebrow">Join Zackconnect Autos</p>
            <h1 id="signupTitle">Create your account</h1>
            <p class="auth-intro">Create an account, then log in to continue to your selected Zackconnect Autos page.</p>

            <form id="signupForm" class="auth-screen-form" novalidate>
                <div class="form-group">
                    <label for="signupName">Full name</label>
                    <input id="signupName" name="name" type="text" autocomplete="name" required>
                </div>
                <div class="form-group">
                    <label for="signupEmail">Email address</label>
                    <input id="signupEmail" name="email" type="email" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label for="signupPassword">Password</label>
                    <input id="signupPassword" name="password" type="password" autocomplete="new-password" minlength="8" required>
                    <span class="help-text">Use at least 8 characters.</span>
                </div>
                <div class="form-group">
                    <label for="signupConfirmPassword">Confirm password</label>
                    <input id="signupConfirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required>
                </div>
                <p class="auth-message" id="signupMessage" role="alert" aria-live="polite"></p>
                <button type="submit" class="btn btn-primary btn-full">Create account</button>
            </form>

            <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
        </section>
    </main>
    <script>
        const signupBackgroundVideo = document.querySelector('.auth-background-video');
        if (signupBackgroundVideo) signupBackgroundVideo.playbackRate = 1.15;
    </script>
</body>
</html>
