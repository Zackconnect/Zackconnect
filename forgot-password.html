<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/webp" href="images/zackconnect-logo.webp">
    <link rel="preconnect" href="https://zackconnectautobackend.onrender.com" crossorigin>
    <meta name="description" content="Request a secure password reset for your Zackconnect Autos account.">
    <title>Forgot Password - Zackconnect Autos</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/api.js" defer></script>
    <script src="js/auth.js" defer></script>
</head>
<body class="auth-page login-page">
    <header class="auth-header">
        <a href="index.html" class="auth-brand"><img src="images/zackconnect-logo.webp" alt="">Zackconnect Autos</a>
        <a href="login.html" class="auth-header-link">Log in</a>
    </header>

    <main class="auth-main">
        <section class="auth-card" aria-labelledby="forgotPasswordTitle">
            <a href="login.html" class="auth-back-link">&larr; Back to log in</a>
            <p class="auth-eyebrow">Account recovery</p>
            <h1 id="forgotPasswordTitle">Forgot your password?</h1>
            <p class="auth-intro">Enter your account email and we’ll send you a link to reset your password.</p>

            <form id="forgotPasswordForm" class="auth-screen-form" novalidate>
                <div class="form-group">
                    <label for="forgotPasswordEmail">Email address</label>
                    <input id="forgotPasswordEmail" name="email" type="email" autocomplete="email" required>
                </div>
                <p class="auth-message" id="forgotPasswordMessage" role="status" aria-live="polite"></p>
                <button type="submit" class="btn btn-primary btn-full">Send reset link</button>
            </form>
        </section>
    </main>
</body>
</html>
